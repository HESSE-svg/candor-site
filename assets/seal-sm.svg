<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Candor">
  <!-- Candor's mark, Ink edition (2026-10-01).
       Same idea as before: the site writes the name "Candor." with the period
       picked out, so the period is the mark and the C carries it; the ring reads
       as a seal (proof), without a gavel or scales.
       Near-black tile, warm rose-to-gilt C, ring and period. -->
  <defs>
    <linearGradient id="cd-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232328"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="cd-warm" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#F6D3C6"/>
      <stop offset="0.55" stop-color="#EDB98E"/>
      <stop offset="1" stop-color="#E3B866"/>
    </linearGradient>
    <radialGradient id="cd-glow" cx="0.5" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#C4523F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C4523F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#cd-tile)"/>
  <rect width="100" height="100" rx="22" fill="url(#cd-glow)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="21.3" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="url(#cd-warm)" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="45" y="51" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="58"
        fill="url(#cd-warm)" text-anchor="middle" dominant-baseline="central">C</text>
  <circle cx="66.5" cy="64.5" r="4.6" fill="#E3B866"/>
</svg>
