<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Candor"><style>
.nb0,.nb1,.nb2,.nb3{transform-box:view-box;transform-origin:256px 256px;animation:2.1s cubic-bezier(.16,.84,.24,1) both}
.nb0{animation-name:nk0}@keyframes nk0{0%{opacity:0;transform:rotate(-540.0deg)}18%{opacity:1}100%{opacity:1;transform:rotate(0.0deg)}}
.nb1{animation-name:nk1}@keyframes nk1{0%{opacity:0;transform:rotate(-561.3deg)}18%{opacity:1}100%{opacity:1;transform:rotate(0.0deg)}}
.nb2{animation-name:nk2}@keyframes nk2{0%{opacity:0;transform:rotate(-582.5deg)}18%{opacity:1}100%{opacity:1;transform:rotate(0.0deg)}}
.nb3{animation-name:nk3}@keyframes nk3{0%{opacity:0;transform:rotate(-603.8deg)}18%{opacity:1}100%{opacity:1;transform:rotate(0.0deg)}}
.nd{transform-box:fill-box;transform-origin:center;animation:ns .55s 1.85s cubic-bezier(.3,1.5,.5,1) both}
.nh{transform-box:fill-box;transform-origin:center;animation:ng 1s 1.9s ease-out both}
@keyframes ns{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
@keyframes ng{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}100%{opacity:.35;transform:scale(1)}}
[data-wait]:not(.play) .nb0,[data-wait]:not(.play) .nb1,[data-wait]:not(.play) .nb2,[data-wait]:not(.play) .nb3,[data-wait]:not(.play) .nd,[data-wait]:not(.play) .nh{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.nb0,.nb1,.nb2,.nb3,.nd,.nh{animation:none}}
