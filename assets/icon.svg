<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Candor">
  <!-- Candor's mark.
       Built from what the brand already does rather than invented beside it:
       the site writes the name as "Candor." with the period picked out in
       oxblood, so the period is the mark, and the C carries it.

       The ring reads as a seal, which is the right metaphor for a product whose
       promise is proof, and gets there without a gavel or a set of scales.

       The period is paper here, not oxblood. On navy, oxblood sits at about
       1.5:1 contrast and disappears entirely at favicon size. It stays oxblood
       on the light wordmark, where it has a ground to show against. The dot is
       always present; its colour follows the background. -->
  <rect width="100" height="100" rx="18" fill="#1B2A41"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="#FAF8F5" stroke-opacity="0.19" stroke-width="2"/>
  <text x="43" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="56"
        fill="#FAF8F5" text-anchor="middle" dominant-baseline="central">C</text>
  <circle cx="67.5" cy="64.5" r="4.5" fill="#FAF8F5"/>
</svg>
